<script>
(function () {
  if (window.storage && typeof window.storage.get === 'function') return;
  var P = 'dashgastos::';
  window.storage = {
    get: function (k) {
      return new Promise(function (res, rej) {
        var v = localStorage.getItem(P + k);
        if (v === null) rej(new Error('no existe: ' + k));
        else res({ key: k, value: v, shared: false });
      });
    },
    set: function (k, v) {
      return new Promise(function (res, rej) {
        try { localStorage.setItem(P + k, v); res({ key: k, value: v, shared: false }); }
        catch (e) { rej(e); }
      });
    },
    delete: function (k) {
      return new Promise(function (res) { localStorage.removeItem(P + k); res({ key: k, deleted: true, shared: false }); });
    },
    list: function (prefix) {
      return new Promise(function (res) {
        var out = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k.indexOf(P) === 0) { var real = k.slice(P.length); if (!prefix || real.indexOf(prefix) === 0) out.push(real); }
        }
        res({ keys: out, prefix: prefix, shared: false });
      });
    }
  };
})();
</script>

const hoyISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const claveMes = iso => iso.slice(0, 7);
const sumarMeses = (clave, n) => {
  const [y, m] = clave.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};
const nombreMes = clave => {
  const [y, m] = clave.split('-').map(Number);
  return `${MESES[m - 1]} ${y}`;
};
const mesCorto = clave => {
  const [, m] = clave.split('-').map(Number);
  return MES_CORTO[m - 1];
};
const anioCorto = clave => clave.slice(2, 4);
const fmtDia = iso => {
  const [, m, d] = iso.split('-');
  return `${d}/${m}`;
};
const fmt = (n, moneda) => {
  const s = (n || 0).toLocaleString('es-AR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
  return moneda === 'USD' ? `US$ ${s}` : `$ ${s}`;
};
const fmtCorto = n => {
  const a = Math.abs(n);
  if (a >= 1000000) return (n / 1000000).toLocaleString('es-AR', {
    maximumFractionDigits: 1
  }) + 'M';
  if (a >= 1000) return (n / 1000).toLocaleString('es-AR', {
    maximumFractionDigits: 0
  }) + 'k';
  return n.toLocaleString('es-AR', {
    maximumFractionDigits: 0
  });
};
const parseMonto = txt => {
  if (!txt) return NaN;
  const limpio = String(txt).trim().replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
  return parseFloat(limpio);
};

  /* imputaciones: un gasto en N cuotas genera N movimientos mensuales */
  const imputaciones = useMemo(() => {

          miParte,
          mes: sumarMeses(claveMes(g.fecha), i),

  const tira = useMemo(() => {

      return {

  }, [imputaciones, monedaVista, mesActual, catFiltro]);
  const maxTira = Math.max(1, ...tira.map(t => t.total));

  /* desgloses del mes, en la moneda de vista */
  const agrupar = fn => {
    const m = {};

  const colorDe = n => (cats.find(c => c.n === n) || {}).c || '#8A8F9E';

  /* administración de categorías (se trabaja sobre un borrador y se aplica al guardar) */
  const abrirCats = () => {

  } : c));
  const quitarDelBorrador = i => setBorrador(b => b.filter((_, k) => k !== i));
  const agregarAlBorrador = () => setBorrador(b => [...b, {
    n: '',

  }]);
  const guardarCats = () => {
    const limpio = borrador.map(c => ({
      ...c,

    })).filter(c => c.n !== '');
    if (limpio.length === 0) {

    const vistos = new Set();

      }
      vistos.add(k);
    }
    const mapa = {};

    const nuevas = limpio.map(c => ({
      n: c.n,

    }));
    setGastos(gs => gs.map(g => ({
      ...g,
      categoria: mapa[g.categoria] || (nuevas.some(c => c.n === g.categoria) ? g.categoria : destino)
    })));
    setCats(nuevas);
    setCategoria(cat => mapa[cat] || (nuevas.some(c => c.n === cat) ? cat : nuevas[0].n));
    setCatFiltro(f => f ? mapa[f] || (nuevas.some(c => c.n === f) ? f : null) : null);
    setCatsOpen(false);

  /* ---------------------- Firebase: guardado en vivo ----------------------
     Modelo: usuarios/{uid}/gastos/{idGasto}  (un documento por gasto)

     Cada cambio local se compara contra lo último que llegó del servidor y
     solo se escriben los gastos que cambiaron. Sin red, Firebase encola y el espejo local evita perder cambios. */

  const explicar = e => {
    const c = e && (e.code || e.message) || '';
    if (c.includes('auth/invalid-credential') || c.includes('auth/wrong-password') || c.includes('auth/invalid-login') || c.includes('auth/user-not-found')) return 'Email o contraseña incorrectos.';
    if (c.includes('auth/too-many-requests')) return 'Demasiados intentos. Esperá unos minutos o restablecé la contraseña.';
    if (c.includes('auth/invalid-email')) return 'El email no tiene un formato válido.';
    if (c.includes('auth/missing-password')) return 'Ingresá la contraseña.';
    if (c.includes('auth/operation-not-allowed')) return 'Falta habilitar Email/Password en Authentication → Sign-in method.';
    if (c.includes('auth/unauthorized-domain')) return 'Agregá este dominio en Authentication → Settings → Authorized domains.';
    if (c.includes('auth/network-request-failed') || c.includes('unavailable')) return 'Sin conexión con Firebase. Probá de nuevo cuando vuelva internet.';
    if (c.toLowerCase().includes('permission') && c.toLowerCase().includes('denied')) return 'Las reglas de Realtime Database no permiten esta operación. Revisá que estén publicadas.';
    if (c.includes('api-key-not-valid')) return 'La apiKey de FIREBASE_CONFIG no es válida.';

  };
  const ahora = () => {

  // sesión: Firebase la recuerda en el dispositivo, no hace falta volver a loguearse
  useEffect(() => {

    }

  }, []);

  // guarda en el dispositivo lo último que la nube confirmó
  const guardarEspejo = R => {
    if (!R || !R.conf) return;
    const g = {};
    R.conf.forEach((c, id) => {
      g[id] = c;
    });
    window.storage.set(ESPEJO, JSON.stringify({

      gastos: g,
      cats: R.confCats === undefined ? null : R.confCats
    })).catch(() => {});
  };

  // suscripción a los datos del usuario logueado (Realtime Database)
  useEffect(() => {
    if (!FB || !usuario || !cargado) return;
    const base = FB.db.ref('usuarios/' + usuario.uid);
    const R = remotoRef.current = {
      uid: usuario.uid,
      base,
      gastos: new Map(),
      // lo enviado / visto en la nube
      cats: null,
      catsVistas: false,
      servidor: false,
      conf: null,
      // lo confirmado por la nube (Map id -> canon)

    };
    setFbEstado('conectando');
    setFbListo(false);

    })();
    const onConn = FB.db.ref('.info/connected').on('value', s => {
      R.conectado = !!s.val();
      if (R.conectado) {
        if (R.servidor && !R.bloqueado) {
          setFbEstado(pendRef.current > 0 ? 'guardando' : 'vivo');
          setFbError('');
        }
      } else if (R.servidor || navigator.onLine === false) setFbEstado('offline');
    });
    const refG = base.child('gastos');
    const onG = refG.on('value', snap => {
      const srv = new Map();
      snap.forEach(ch => {
        const g = Object.assign({}, ch.val());
        g.id = ch.key;
        if (g.banco === undefined) g.banco = null;
        if (g.tarjeta === undefined) g.tarjeta = null;
        srv.set(ch.key, g);
      });
      const primera = !R.servidor;
      R.servidor = true;
      let lista;

        // mezcla: lo que cambió en este dispositivo y todavía no subió se respeta

        const loc = new Map(gastosRef.current.map(g => [String(g.id), g]));
        loc.forEach((g, id) => {
          if (R.conf.get(id) !== canon(g)) res.set(id, g);
        });
        R.conf.forEach((c, id) => {
          if (!loc.has(id)) res.delete(id);
        });
        lista = [...res.values()];
      } else if (primera && srv.size === 0 && previoRef.current && previoRef.current.length) {
        // migración única: gastos cargados antes de usar Firebase suben a la nube
        lista = previoRef.current;
      } else lista = [...srv.values()];
      if (primera) previoRef.current = null;
      const mapa = new Map();
      srv.forEach((g, id) => mapa.set(id, canon(g)));
      R.gastos = mapa;
      if (pendRef.current === 0) {
        R.conf = new Map(mapa);
        guardarEspejo(R);
      }
      lista.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || String(b.id).localeCompare(String(a.id)));
      setGastos(lista);
      setFbListo(true);
      if (!R.bloqueado) {
        if (pendRef.current > 0) setFbEstado('guardando');else {

    }, err => {

    const refC = base.child('config/app');
    const onC = refC.on('value', snap => {
      const d = snap.val();
      const srvCats = d && Array.isArray(d.cats) && d.cats.length ? d.cats : null;
      const local = canon(catsRef.current);

        if (!locales.has(id)) {
          ops.push(['del', id]);
          upd['gastos/' + id] = null;

        cats,
        actualizado: new Date().toISOString()
      };

      if (subirCats) R.cats = catsC;

  const entrar = async () => {

    };

  const FB_TEXTO = {

  };
  useEffect(() => () => clearTimeout(toastRef.current), []);
  const FB_PUNTO = {
